<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B1526;
    --bg-1:#0F1E33;
    --bg-2:#15283F;
    --signal:#5FE3D3;
    --signal-dim:#2E5C57;
    --breath:#FF9F6B;
    --locked:#33445A;
    --locked-fill:#1A2739;
    --text:#EAF2F0;
    --text-dim:#8FA3B8;
    --violet:#A78BFA;
    --ok:#7CD98A;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    min-height:100%;
    background:var(--bg-0);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow-x:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
  }

  /* ambient breathing glow */
  .breath-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 30% 15%, rgba(95,227,211,0.10), transparent 60%),
      radial-gradient(ellipse 55% 45% at 75% 80%, rgba(255,159,107,0.08), transparent 60%);
    animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); opacity:0.85; }
    50%{ transform:scale(1.06); opacity:1; }
  }

  header{
    position:relative;
    z-index:2;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding:28px 24px 8px;
    max-width:520px;
    margin:0 auto;
  }

  .title-block h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.55rem;
    line-height:1.15;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .title-block p{
    margin:0;
    font-size:0.85rem;
    color:var(--text-dim);
  }

  .score-badge{
    text-align:right;
    flex-shrink:0;
  }
  .score-badge .pts{
    font-family:'JetBrains Mono',monospace;
    font-size:1.25rem;
    font-weight:600;
    color:var(--signal);
  }
  .score-badge .tier{
    font-size:0.7rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-top:2px;
  }

  main{
    position:relative;
    z-index:2;
    max-width:520px;
    margin:0 auto;
    padding:10px 8px 60px;
  }

  .map-wrap{
    position:relative;
  }

  svg.path-map{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }

  .path-base{
    fill:none;
    stroke:var(--locked);
    stroke-width:5;
    stroke-linecap:round;
  }
  .path-progress{
    fill:none;
    stroke:var(--signal);
    stroke-width:5;
    stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(95,227,211,0.55));
    transition:stroke-dashoffset 900ms cubic-bezier(.4,0,.2,1);
  }

  .pulse-dot{
    fill:var(--signal);
    filter:drop-shadow(0 0 5px rgba(95,227,211,0.9));
  }

  .node{
    cursor:pointer;
    outline:none;
  }
  .node circle.ring{
    fill:var(--locked-fill);
    stroke:var(--locked);
    stroke-width:3;
    transition:stroke 300ms, fill 300ms;
  }
  .node.unlocked circle.ring{
    stroke:var(--signal);
    fill:#123A38;
    animation:node-breathe 3.2s ease-in-out infinite;
  }
  .node.completed circle.ring{
    stroke:var(--ok);
    fill:#13351F;
  }
  .node.locked{ cursor:default; }

  @keyframes node-breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }
  .node{ transform-box:fill-box; transform-origin:center; }

  .node:focus-visible circle.ring{
    stroke:var(--violet);
    stroke-width:4;
  }

  .node text.num{
    font-family:'JetBrains Mono',monospace;
    font-weight:600;
    fill:var(--text-dim);
    font-size:15px;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }
  .node.unlocked text.num,
  .node.completed text.num{ fill:var(--text); }

  .node text.label{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:500;
    fill:var(--text-dim);
    pointer-events:none;
  }
  .node.unlocked text.label,
  .node.completed text.label{ fill:var(--text); }

  .lock-icon, .check-icon{ pointer-events:none; }

  /* level overlay */
  .level-screen{
    position:fixed;
    inset:0;
    z-index:10;
    background:var(--bg-0);
    display:none;
    flex-direction:column;
  }
  .level-screen.open{ display:flex; }

  .level-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 20px 14px;
    border-bottom:1px solid var(--bg-2);
  }
  .back-btn{
    background:none;
    border:1px solid var(--locked);
    color:var(--text);
    border-radius:999px;
    width:36px;
    height:36px;
    font-size:1rem;
    cursor:pointer;
  }
  .back-btn:hover{ border-color:var(--signal); color:var(--signal); }

  .level-header h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.2rem;
    margin:0;
  }
  .level-header .eyebrow{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:0.7rem;
    color:var(--signal);
    letter-spacing:0.08em;
    margin-bottom:2px;
  }

  .level-body{
    flex:1;
    max-width:520px;
    width:100%;
    margin:0 auto;
    padding:28px 22px 40px;
  }

  .placeholder-card{
    border:1px dashed var(--locked);
    border-radius:14px;
    padding:22px;
    color:var(--text-dim);
    font-size:0.92rem;
    line-height:1.5;
  }

  .complete-btn{
    margin-top:24px;
    background:var(--signal);
    color:#062824;
    border:none;
    border-radius:10px;
    padding:13px 20px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    width:100%;
  }
  .complete-btn:hover{ filter:brightness(1.08); }
  .complete-btn:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }

  .test-tag{
    display:inline-block;
    margin-top:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    color:var(--breath);
    letter-spacing:0.06em;
  }

  .stage-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.05rem;
    margin:0 0 4px;
  }
  .stage-progress{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    color:var(--text-dim);
    margin-bottom:16px;
  }
  .flash-card{
    background:var(--bg-2);
    border:1px solid var(--locked);
    border-radius:14px;
    padding:22px;
    font-size:1.05rem;
    line-height:1.5;
    margin-bottom:18px;
    min-height:60px;
    display:flex;
    align-items:center;
  }
  .flash-btns{
    display:flex;
    gap:10px;
  }
  .nav-row{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .nav-row .opt-btn{ flex:0 0 auto; min-width:110px; }
  .opt-btn{
    flex:1;
    background:var(--bg-1);
    border:1px solid var(--locked);
    color:var(--text);
    border-radius:10px;
    padding:13px 10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    text-align:center;
  }
  .opt-btn:hover:not(:disabled){ border-color:var(--signal); color:var(--signal); }
  .opt-btn:disabled{ cursor:default; opacity:0.75; }
  .opt-btn:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }
  .flash-feedback{
    margin-top:12px;
    font-size:0.88rem;
    min-height:20px;
  }
  .flash-feedback.ok{ color:var(--ok); }
  .flash-feedback.bad{ color:var(--breath); }

  .quiz-timer{
    font-family:'JetBrains Mono',monospace;
    font-size:0.9rem;
    color:var(--breath);
    margin-bottom:10px;
  }
  .quiz-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .quiz-opt.correct{ border-color:var(--ok) !important; color:var(--ok) !important; }
  .quiz-opt.wrong{ border-color:#E06B6B !important; color:#E06B6B !important; }
  .opt-btn.correct{ border-color:var(--ok) !important; color:var(--ok) !important; }
  .opt-btn.wrong{ border-color:#E06B6B !important; color:#E06B6B !important; }

  .help-links{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }
  .help-links a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--bg-2);
    border:1px solid var(--violet);
    color:var(--violet);
    text-decoration:none;
    font-size:0.8rem;
    font-weight:500;
    padding:8px 12px;
    border-radius:999px;
  }
  .help-links a:hover{ background:var(--violet); color:var(--bg-0); }
  .help-links a:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }

  .calc-input-row{
    display:flex;
    gap:10px;
    margin-bottom:4px;
  }
  .calc-input-row input{
    flex:1;
    background:var(--bg-1);
    border:1px solid var(--locked);
    color:var(--text);
    border-radius:10px;
    padding:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:1rem;
    min-width:0;
  }
  .calc-input-row input:focus-visible{ outline:2px solid var(--violet); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    .breath-bg, .node.unlocked circle.ring{ animation:none; }
    .path-progress{ transition:none; }
  }
</style>
</head>
<body>

<div class="breath-bg" aria-hidden="true"></div>

<header>
  <div class="title-block">
    <h1>Módulo 6</h1>
    <p>Regulação, Circulação, Respiração, Digestão &amp; Equilíbrio Interno</p>
  </div>
  <div class="score-badge">
    <div class="pts" id="pts-display">0 pts</div>
    <div class="tier" id="tier-display">—</div>
  </div>
</header>

<main>
  <div class="map-wrap">
    <svg class="path-map" viewBox="0 0 400 900" id="map-svg">
      <path class="path-base" d="M120,780 C200,700 260,680 280,620 C300,560 180,520 100,460 C40,400 260,360 300,300 C340,240 200,180 160,120" />
      <path class="path-progress" id="progress-path" d="M120,780 C200,700 260,680 280,620 C300,560 180,520 100,460 C40,400 260,360 300,300 C340,240 200,180 160,120" />

      <circle class="pulse-dot" r="5" id="pulse-dot">
        <animateMotion dur="6s" repeatCount="indefinite"
          path="M120,780 C200,700 260,680 280,620 C300,560 180,520 100,460 C40,400 260,360 300,300 C340,240 200,180 160,120" />
      </circle>

      <!-- Nível 1 -->
      <g class="node" data-level="1" tabindex="0" transform="translate(120,780)">
        <circle class="ring" r="30"></circle>
        <text class="num" y="0">1</text>
        <text class="label" x="42" y="-6">Regulação Interna</text>
        <text class="label" x="42" y="10">Nervosa &amp; Endócrina</text>
      </g>

      <!-- Nível 2 -->
      <g class="node" data-level="2" tabindex="0" transform="translate(280,620)">
        <circle class="ring" r="30"></circle>
        <text class="num" y="0">2</text>
        <text class="label" x="42" y="-6">Aparelho</text>
        <text class="label" x="42" y="10">Circulatório</text>
      </g>

      <!-- Nível 3 -->
      <g class="node" data-level="3" tabindex="0" transform="translate(100,460)">
        <circle class="ring" r="30"></circle>
        <text class="num" y="0">3</text>
        <text class="label" x="-42" y="-6" text-anchor="end">Aparelho</text>
        <text class="label" x="-42" y="10" text-anchor="end">Respiratório</text>
      </g>

      <!-- Nível 4 -->
      <g class="node" data-level="4" tabindex="0" transform="translate(300,300)">
        <circle class="ring" r="30"></circle>
        <text class="num" y="0">4</text>
        <text class="label" x="42" y="-6">Digestivo</text>
        <text class="label" x="42" y="10">&amp; Urinário</text>
      </g>

      <!-- Nível 5 -->
      <g class="node" data-level="5" tabindex="0" transform="translate(160,120)">
        <circle class="ring" r="34"></circle>
        <text class="num" y="0">5</text>
        <text class="label" x="46" y="-6">Equilíbrio Final</text>
        <text class="label" x="46" y="10">Térmico &amp; Hídrico</text>
      </g>
    </svg>
  </div>
</main>

<!-- Level overlay screen -->
<div class="level-screen" id="level-screen">
  <div class="level-header">
    <button class="back-btn" id="back-btn" aria-label="Voltar ao mapa">←</button>
    <div>
      <span class="eyebrow" id="level-eyebrow">NÍVEL X</span>
      <h2 id="level-title">Título do nível</h2>
    </div>
  </div>
  <div class="level-body">
    <div class="help-links" id="help-links" style="display:none;"></div>
    <div id="level-content">
      <div class="placeholder-card">Conteúdo deste nível ainda por preencher — vamos construir isto a seguir, nível a nível.</div>
    </div>
    <button class="complete-btn" id="complete-btn">Concluir nível</button>
    <span class="test-tag" id="test-tag">[botão temporário para testar o desbloqueio — será substituído pela tarefa real]</span>
  </div>
</div>

<script>
  const LEVELS = [
    { id:1, name:'Regulação Nervosa e Endócrina', basePoints:10 },
    { id:2, name:'Aparelho Circulatório', basePoints:15 },
    { id:3, name:'Aparelho Respiratório', basePoints:20 },
    { id:4, name:'Aparelho Digestivo e Urinário', basePoints:20 },
    { id:5, name:'Regulação Térmica e Hídrica', basePoints:25 },
  ];

  const CLASSIFY_NE = [
    { text:'Transmite a mensagem através de impulsos elétricos.', answer:'nervosa' },
    { text:'Transmite a mensagem através do sangue, sob a forma de hormonas.', answer:'endocrina' },
    { text:'Resposta rápida, medida em milissegundos.', answer:'nervosa' },
    { text:'Resposta lenta, que pode demorar minutos a horas a instalar-se.', answer:'endocrina' },
    { text:'Efeito geralmente localizado e de curta duração.', answer:'nervosa' },
    { text:'Efeito geralmente generalizado e duradouro.', answer:'endocrina' },
    { text:'Usa neurónios como via de comunicação.', answer:'nervosa' },
    { text:'Usa glândulas endócrinas e o sangue como via de comunicação.', answer:'endocrina' },
  ];

  const CLASSIFY_SP = [
    { text:'Aumenta a frequência cardíaca.', answer:'simpatico' },
    { text:'Diminui a frequência cardíaca.', answer:'parassimpatico' },
    { text:'Dilata as pupilas.', answer:'simpatico' },
    { text:'Contrai as pupilas.', answer:'parassimpatico' },
    { text:'Aumenta a frequência respiratória.', answer:'simpatico' },
    { text:'Estimula os processos digestivos.', answer:'parassimpatico' },
    { text:'Prepara o corpo para "luta ou fuga".', answer:'simpatico' },
    { text:'Promove o "descanso e digestão".', answer:'parassimpatico' },
  ];

  const QUIZ_L1 = [
    { q:'O que é uma glândula endócrina?', options:['Um órgão que produz hormonas e as liberta diretamente no sangue','Um músculo que se contrai por estímulo elétrico','Um vaso sanguíneo de grande calibre','Um recetor sensorial da pele'], correct:0 },
    { q:'O que é uma hormona?', options:['Um tipo de célula nervosa','Um mensageiro químico transportado pelo sangue até um órgão-alvo','Um recetor localizado no cérebro','Um tipo de vaso linfático'], correct:1 },
    { q:'O que é o "órgão-alvo" de uma hormona?', options:['O órgão que produz a hormona','Qualquer órgão do corpo, sem exceção','O órgão ou tecido com recetores específicos que respondem a essa hormona','O órgão que elimina a hormona do corpo'], correct:2 },
    { q:'Porque é a hipófise chamada "glândula mestra"?', options:['Porque é a maior glândula do corpo','Porque regula a atividade de várias outras glândulas endócrinas','Porque só atua durante o sono','Porque não depende do cérebro'], correct:1 },
    { q:'Qual destas características pertence à regulação NERVOSA (e não à endócrina)?', options:['Efeito lento e duradouro','Mensageiro transportado pelo sangue','Resposta rápida e de curta duração','Ação generalizada em todo o corpo'], correct:2 },
    { q:'Antes de uma competição importante, um atleta sente o coração acelerar e as mãos a tremer ligeiramente, mesmo sem ainda ter começado a competir. Isto deve-se sobretudo à ação de:', options:['Sistema nervoso simpático e libertação de adrenalina','Sistema nervoso parassimpático','Sistema digestivo','Sistema urinário'], correct:0 },
  ];

  const LEVEL_LINKS = {
    1: [
      { label: 'Genially: Homeostasia', url: 'https://view.genially.com/659bc4c3582e380014f3d636' },
      { label: 'Genially: Sistema Nervoso/Endócrino', url: 'https://view.genially.com/659bc4f9b82d3b00159432b6' },
    ],
    2: [
      { label: 'Genially: Sistema Circulatório 1/2', url: 'https://view.genially.com/659bc519b82d3b0015944827' },
      { label: 'Genially: Sistema Circulatório 2/2', url: 'https://view.genially.com/659bc5096670f50013edec2b' },
    ],
    3: [
      { label: 'Genially: Sistema Respiratório', url: 'https://view.genially.com/659bc52a582e380014f40754' },
    ],
    4: [
      { label: 'Genially: Sistema Digestivo 1/2', url: 'https://view.genially.com/659bc53dcc82080014bd14a0' },
      { label: 'Genially: Sistema Digestivo 2/2 e Urinário', url: 'https://view.genially.com/659bc5546670f50013ee31ff' },
    ],
    5: [
      { label: 'Genially: Regulação Hídrico e Eletrolítico', url: 'https://view.genially.com/659bc55d58842c0014a5dccd' },
    ],
  };

  const CLASSIFY_TEMP = [
    { text:'Vasodilatação periférica (os vasos sanguíneos da pele dilatam).', answer:'hiper' },
    { text:'Vasoconstrição periférica (os vasos sanguíneos da pele contraem).', answer:'hipo' },
    { text:'Aumento da sudorese (transpiração).', answer:'hiper' },
    { text:'Arrepio e tremor muscular (tiritar).', answer:'hipo' },
    { text:'Comportamento voluntário: procurar a sombra ou beber água fresca.', answer:'hiper' },
    { text:'Comportamento voluntário: vestir mais roupa ou procurar abrigo.', answer:'hipo' },
    { text:'O corpo tenta perder calor para o ambiente.', answer:'hiper' },
    { text:'O corpo tenta reter e produzir mais calor.', answer:'hipo' },
  ];

  const CLASSIFY_HIDRICO = [
    { text:'Deteta alterações na concentração de solutos no sangue (osmolaridade).', answer:'osmo' },
    { text:'Deteta alterações no volume de sangue e líquidos circulantes.', answer:'volume' },
    { text:'Está muito relacionado com o mecanismo da sede.', answer:'osmo' },
    { text:'Pode ser ativado, por exemplo, após uma hemorragia significativa.', answer:'volume' },
    { text:'Localiza-se sobretudo no hipotálamo, sensível à concentração do plasma.', answer:'osmo' },
    { text:'Localiza-se em zonas como as aurículas do coração e os grandes vasos.', answer:'volume' },
    { text:'É ativado quando bebemos pouca água e o sangue fica mais concentrado.', answer:'osmo' },
    { text:'É ativado quando há perda de volume de líquidos, como em vómitos ou diarreia intensa.', answer:'volume' },
  ];

  const QUIZ_L5 = [
    { q:'Qual é, em geral, a temperatura corporal central de referência no ser humano?', options:['Aproximadamente 37°C','Aproximadamente 30°C','Aproximadamente 42°C','Aproximadamente 25°C'], correct:0 },
    { q:'Qual destas NÃO é uma forma de transferência de calor entre o corpo e o ambiente?', options:['Condução','Convecção','Radiação','Digestão'], correct:3 },
    { q:'A evaporação do suor ajuda o corpo a:', options:['Ganhar calor rapidamente','Perder calor, arrefecendo a pele','Reter mais água','Aumentar a frequência cardíaca'], correct:1 },
    { q:'O que desencadeia o mecanismo da sede?', options:['A diminuição da temperatura corporal','O aumento da frequência respiratória','O aumento da osmolaridade do sangue ou a diminuição do volume de líquidos corporais','A contração do músculo cardíaco'], correct:2 },
    { q:'Numa situação de hipertermia (temperatura corporal elevada), o corpo tende a:', options:['Vasodilatar e transpirar, para perder calor','Vasoconstringir e tremer, para reter calor','Parar de produzir urina','Aumentar a digestão'], correct:0 },
    { q:'Porque é importante regular o equilíbrio hídrico e eletrolítico?', options:['Apenas para controlar a temperatura corporal','Apenas para regular a digestão','Para manter o volume e a composição dos líquidos corporais compatíveis com a vida','Não tem influência no funcionamento do organismo'], correct:2 },
    { q:'Durante uma prova de longa duração ao sol, um atleta deve beber água regularmente sobretudo para:', options:['Repor os líquidos perdidos pela sudorese e evitar a desidratação','Aumentar a temperatura corporal','Reduzir a frequência cardíaca a zero','Impedir a vasodilatação'], correct:0 },
  ];

  const CLASSIFY_NUTRIENTS = [
    { text:'Hidratos de carbono.', answer:'macro' },

  // status: 'locked' | 'unlocked' | 'completed'
  let state = {
    points: 0,
    status: { 1:'unlocked', 2:'locked', 3:'locked', 4:'locked', 5:'locked' }

  const ptsDisplay = document.getElementById('pts-display');
  const tierDisplay = document.getElementById('tier-display');
  const progressPath = document.getElementById('progress-path');
  const levelScreen = document.getElementById('level-screen');
  const levelEyebrow = document.getElementById('level-eyebrow');
  const levelTitle = document.getElementById('level-title');
  const levelContentEl = document.getElementById('level-content');
  const helpLinksEl = document.getElementById('help-links');
  const completeBtn = document.getElementById('complete-btn');
  const testTag = document.getElementById('test-tag');
  const backBtn = document.getElementById('back-btn');

  let activeLevel = null;
  const pathLength = progressPath.getTotalLength();
  progressPath.style.strokeDasharray = pathLength;

  function tierFor(points){
    if(points >= 135) return 'Ouro 🥇';
    if(points >= 100) return 'Prata 🥈';
    if(points >= 60) return 'Bronze 🥉';
    return '—';
  }

  function render(){
    ptsDisplay.textContent = state.points + ' pts';
    tierDisplay.textContent = tierFor(state.points);

    const completedCount = Object.values(state.status).filter(s => s === 'completed').length;
    const revealed = pathLength * (completedCount / LEVELS.length);
    progressPath.style.strokeDashoffset = pathLength - revealed;

    document.querySelectorAll('.node').forEach(node => {
      const lvl = Number(node.dataset.level);
      node.classList.remove('locked','unlocked','completed');
      node.classList.add(state.status[lvl]);
      node.setAttribute('aria-disabled', state.status[lvl] === 'locked');
    });
  }

  function openLevel(id){
    if(state.status[id] === 'locked') return;
    activeLevel = id;
    const lvl = LEVELS.find(l => l.id === id);
    levelEyebrow.textContent = 'NÍVEL ' + id;
    levelTitle.textContent = lvl.name;
    levelScreen.classList.add('open');

    if(id === 1){
      setupLevel1();
    } else if(id === 2){
      setupLevel2();
    } else if(id === 3){
      setupLevel3();
    } else if(id === 4){
      setupLevel4();
    } else if(id === 5){
      setupLevel5();
    } else {
      completeBtn.style.display = 'block';
      testTag.style.display = 'inline-block';
      helpLinksEl.style.display = 'none';
      levelContentEl.innerHTML = '<div class="placeholder-card">Conteúdo deste nível ainda por preencher — vamos construir isto a seguir, nível a nível.</div>';
      completeBtn.disabled = state.status[id] === 'completed';
      completeBtn.textContent = state.status[id] === 'completed' ? 'Nível já concluído' : 'Concluir nível';
    }
  }

  function renderHelpLinks(id){
    const links = LEVEL_LINKS[id];
    if(!links){ helpLinksEl.style.display = 'none'; return; }
    helpLinksEl.innerHTML = links.map(l =>
      `<a href="${l.url}" target="_blank" rel="noopener">📖 ${l.label}</a>`
    ).join('');
    helpLinksEl.style.display = 'flex';
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setupLevel1(){
    completeBtn.style.display = 'none';
    testTag.style.display = 'none';
    renderHelpLinks(1);

    if(state.status[1] === 'completed'){
      levelContentEl.innerHTML = `
        <div class="placeholder-card">Já concluíste este nível — bom trabalho! Podes rever os desafios para consolidar a matéria, sem perder pontos.</div>
        <button class="complete-btn" id="review-btn" style="margin-top:16px;">Rever desafios</button>
      `;
      document.getElementById('review-btn').addEventListener('click', () => runLevel1Flow(true));
      return;
    }
    runLevel1Flow(false);
  }

  function runLevel1Flow(isReview){
    let stage = 0;
    showStage();

    function showStage(){
      if(stage === 0){
        runClassifyStage(CLASSIFY_NE, 'Nervosa', 'Endócrina', 'nervosa', 'endocrina', 'Parte 1 de 3 — Nervosa vs Endócrina', () => { stage = 1; showStage(); });
      } else if(stage === 1){
        runClassifyStage(CLASSIFY_SP, 'Simpático', 'Parassimpático', 'simpatico', 'parassimpatico', 'Parte 2 de 3 — Simpático vs Parassimpático', () => { stage = 2; showStage(); });
      } else if(stage === 2){
        runQuizStage(QUIZ_L1, 'Parte 3 de 3 — Quiz Cronometrado', () => { stage = 3; showStage(); }, 60);
      } else {
        levelContentEl.innerHTML = '<div class="placeholder-card" style="border-style:solid;border-color:var(--ok);color:var(--text);">Concluíste as 3 partes do Nível 1! 🎉</div>';
        const btn = document.createElement('button');
        btn.className = 'complete-btn';
        btn.style.marginTop = '18px';
        btn.textContent = isReview ? 'Voltar ao mapa' : 'Concluir Nível 1';
        btn.addEventListener('click', () => { isReview ? closeLevel() : completeLevel(1); });
        levelContentEl.appendChild(btn);
      }
    }
  }

  function runClassifyStage(items, labelA, labelB, keyA, keyB, title, onDone){
    const deck = shuffle(items);
    const answers = new Array(deck.length).fill(null);
    let idx = 0;
    renderCard();

    function renderCard(){
      const item = deck[idx];
      levelContentEl.innerHTML = `
        <div class="stage-title">${title}</div>
        <div class="stage-progress">Item ${idx + 1} / ${deck.length}</div>
        <div class="flash-card">${item.text}</div>
        <div class="flash-btns">
          <button class="opt-btn" data-choice="${keyA}">${labelA}</button>
          <button class="opt-btn" data-choice="${keyB}">${labelB}</button>
        </div>
        <div class="flash-feedback" id="flash-feedback"></div>
        <div class="nav-row">
          <button class="opt-btn" id="prev-item-btn" ${idx === 0 ? 'disabled' : ''}>← Anterior</button>
          <button class="complete-btn" id="next-item-btn" style="flex:1;">${idx === deck.length - 1 ? 'Concluir Parte' : 'Seguinte →'}</button>
        </div>
      `;
      const buttons = levelContentEl.querySelectorAll('.flash-btns .opt-btn');
      const feedback = document.getElementById('flash-feedback');

      function paint(){
        buttons.forEach(b => {
          b.classList.remove('correct','wrong');
          if(answers[idx] !== null){
            if(b.dataset.choice === item.answer) b.classList.add('correct');
            if(b.dataset.choice === answers[idx] && answers[idx] !== item.answer) b.classList.add('wrong');
          }
        });
        if(answers[idx] === null){
          feedback.textContent = '';
          feedback.className = 'flash-feedback';
        } else if(answers[idx] === item.answer){
          feedback.textContent = 'Certo! ✅';
          feedback.className = 'flash-feedback ok';
        } else {
          const correctLabel = item.answer === keyA ? labelA : labelB;
          feedback.textContent = 'Resposta certa: "' + correctLabel + '".';
          feedback.className = 'flash-feedback bad';
        }
      }
      paint();

      buttons.forEach(b => {
        b.addEventListener('click', () => {
          answers[idx] = b.dataset.choice;
          paint();
        });
      });

      document.getElementById('prev-item-btn').addEventListener('click', () => { idx--; renderCard(); });
      document.getElementById('next-item-btn').addEventListener('click', () => {
        if(idx < deck.length - 1){ idx++; renderCard(); }
        else { finishStage(); }
      });
    }

    function finishStage(){
      let score = 0;
      deck.forEach((item, i) => { if(answers[i] === item.answer) score++; });
      const pct = Math.round((score / deck.length) * 100);
      const nota = ((score / deck.length) * 20).toFixed(1);
      levelContentEl.innerHTML = `
        <div class="placeholder-card">Resultado: <strong>${score} / ${deck.length}</strong> corretas (${pct}% — nota: ${nota}/20).</div>
        <div class="flash-btns" style="margin-top:16px;">
          <button class="opt-btn" id="retry-classify-btn">Tentar novamente</button>
          <button class="complete-btn" id="continue-classify-btn" style="flex:1;">Continuar</button>
        </div>
      `;
      document.getElementById('retry-classify-btn').addEventListener('click', () => runClassifyStage(items, labelA, labelB, keyA, keyB, title, onDone));
      document.getElementById('continue-classify-btn').addEventListener('click', onDone);
    }
  }

  function runQuizStage(questions, title, onDone, timeSeconds){
    const total = timeSeconds || 60;
    const deck = shuffle(questions);
    const answers = new Array(deck.length).fill(null);
    let idx = 0;
    let timeLeft = total;
    let timerId = null;

    levelContentEl.innerHTML = `
      <div class="stage-title">${title}</div>
      <div class="stage-progress">Tens ${total} segundos no total para responder a ${deck.length} perguntas. Podes navegar entre perguntas e mudar respostas até concluíres.</div>
      <button class="complete-btn" id="start-quiz-btn" style="margin-top:16px;">Começar</button>
    `;
    document.getElementById('start-quiz-btn').addEventListener('click', () => {
      timerId = setInterval(() => {
        timeLeft--;
        const el = document.getElementById('quiz-timer');
        if(el) el.textContent = '⏱ ' + timeLeft + 's';
        if(timeLeft <= 0){ clearInterval(timerId); finishQuiz(); }
      }, 1000);
      renderQuestion();
    });

    function renderQuestion(){
      const q = deck[idx];
      levelContentEl.innerHTML = `
        <div class="quiz-timer" id="quiz-timer">⏱ ${timeLeft}s</div>
        <div class="stage-progress">Pergunta ${idx + 1} / ${deck.length}</div>
        <div class="flash-card">${q.q}</div>
        <div class="quiz-options">
          ${q.options.map((opt, i) => `<button class="opt-btn quiz-opt" data-i="${i}">${opt}</button>`).join('')}
        </div>
        <div class="nav-row">
          <button class="opt-btn" id="prev-item-btn" ${idx === 0 ? 'disabled' : ''}>← Anterior</button>
          <button class="complete-btn" id="next-item-btn" style="flex:1;">${idx === deck.length - 1 ? 'Concluir Parte' : 'Seguinte →'}</button>
        </div>
      `;
      const opts = levelContentEl.querySelectorAll('.quiz-opt');

      function paint(){
        opts.forEach((b, i) => {
          b.classList.remove('correct','wrong');
          if(answers[idx] !== null){
            if(i === q.correct) b.classList.add('correct');
            if(i === answers[idx] && answers[idx] !== q.correct) b.classList.add('wrong');
          }
        });
      }
      paint();

      opts.forEach((b, i) => {
        b.addEventListener('click', () => {
          answers[idx] = i;
          paint();
        });
      });

      document.getElementById('prev-item-btn').addEventListener('click', () => { idx--; renderQuestion(); });
      document.getElementById('next-item-btn').addEventListener('click', () => {
        if(idx < deck.length - 1){ idx++; renderQuestion(); }
        else { clearInterval(timerId); finishQuiz(); }
      });
    }

    function finishQuiz(){
      let score = 0;
      deck.forEach((q, i) => { if(answers[i] === q.correct) score++; });
      const pct = Math.round((score / deck.length) * 100);
      const nota = ((score / deck.length) * 20).toFixed(1);
      levelContentEl.innerHTML = `
        <div class="placeholder-card">Resultado do quiz: <strong>${score} / ${deck.length}</strong> (${pct}% — nota: ${nota}/20)</div>
        <div class="flash-btns" style="margin-top:16px;">
          <button class="opt-btn" id="retry-quiz-btn">Tentar novamente</button>
          <button class="complete-btn" id="continue-btn" style="flex:1;">Continuar</button>
        </div>
      `;
      document.getElementById('retry-quiz-btn').addEventListener('click', () => runQuizStage(questions, title, onDone, total));
      document.getElementById('continue-btn').addEventListener('click', onDone);
    }
  }

  function runCalcStage(problems, title, onDone){
    const deck = shuffle(problems);
    let idx = 0;
    renderProblem();

    function renderProblem(){
      if(idx >= deck.length){ onDone(); return; }
      const p = deck[idx];
      levelContentEl.innerHTML = `
        <div class="stage-title">${title}</div>
        <div class="stage-progress">Problema ${idx + 1} / ${deck.length}</div>
        <div class="flash-card">${p.text}</div>
        <div class="calc-input-row">
          <input type="number" id="calc-input" placeholder="Resultado em ${p.unit}">
          <button class="opt-btn" id="calc-check-btn" style="flex:0 0 auto;">Verificar</button>
        </div>
        <div class="flash-feedback" id="flash-feedback"></div>
      `;
      const input = document.getElementById('calc-input');
      const checkBtn = document.getElementById('calc-check-btn');
      const check = () => {
        const val = Number(input.value);
        const feedback = document.getElementById('flash-feedback');
        if(val === p.answer){
          feedback.textContent = 'Certo! ✅ (' + p.answer + ' ' + p.unit + ')';
          feedback.className = 'flash-feedback ok';
          input.disabled = true;
          checkBtn.disabled = true;
          setTimeout(() => { idx++; renderProblem(); }, 700);
        } else {
          feedback.textContent = 'Não é esse valor — revê a fórmula (Débito Cardíaco = Frequência Cardíaca × Volume Sistólico) e tenta outra vez.';
          feedback.className = 'flash-feedback bad';
        }
      };
      checkBtn.addEventListener('click', check);
      input.addEventListener('keydown', e => { if(e.key === 'Enter') check(); });
    }
  }

    testTag.style.display = 'none';

        runClassifyStage(CLASSIFY_DC, 'Aumenta', 'Diminui', 'aumenta', 'diminui', 'Parte 3 de 4 — O que Aumenta ou Diminui o Débito Cardíaco?', () => { stage = 3; showStage(); });
      } else if(stage === 3){
        runQuizStage(QUIZ_L2, 'Parte 4 de 4 — Quiz Cronometrado', () => { stage = 4; showStage(); }, 75);
      } else {
        levelContentEl.innerHTML = '<div class="placeholder-card" style="border-style:solid;border-color:var(--ok);color:var(--text);">Concluíste as 4 partes do Nível 2! 🎉</div>';

        btn.style.marginTop = '18px';
        btn.textContent = isReview ? 'Voltar ao mapa' : 'Concluir Nível 2';

      } else if(stage === 1){
        runClassifyStage(CLASSIFY_HIDRICO, 'Recetor de Osmolaridade', 'Recetor de Volume', 'osmo', 'volume', 'Parte 2 de 3 — Recetores de Osmolaridade vs de Volume', () => { stage = 2; showStage(); });

  function closeLevel(){
    levelScreen.classList.remove('open');
    activeLevel = null;
  }

  function completeLevel(id){
    if(state.status[id] === 'completed') return;
    state.status[id] = 'completed';
    state.points += LEVELS.find(l => l.id === id).basePoints;
    if(id < LEVELS.length && state.status[id+1] === 'locked'){
      state.status[id+1] = 'unlocked';
    }
    render();
    closeLevel();
  }

  document.querySelectorAll('.node').forEach(node => {
    const lvl = Number(node.dataset.level);
    node.addEventListener('click', () => openLevel(lvl));
    node.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLevel(lvl); }
    });
  });

  backBtn.addEventListener('click', closeLevel);
  completeBtn.addEventListener('click', () => { if(activeLevel) completeLevel(activeLevel); });

  render();
</script>
